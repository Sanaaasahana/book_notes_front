<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://backend-cpn2.onrender.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://backend-cpn2.onrender.com;">
  <title>Book Notes</title>

  <!-- Fonts and Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />

  <!-- Styles -->
  <link href="css/styles.css" rel="stylesheet" />
  <style>
    /* Toast Notification Styles */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 8px;
      color: #fff;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }

    .toast.show {
      opacity: 1;
      pointer-events: auto;
    }

    .toast.success { background-color: #28a745; }
    .toast.error { background-color: #dc3545; }
    .toast.warning { background-color: #ffc107; color: #000; }
    .toast.info { background-color: #007bff; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Book Notes</h1>
      <nav id="nav"></nav>
    </header>

    <main id="main-content">
      <!-- Category Section -->
      <section id="categories-section">
        <h2>Categories</h2>

        <!-- Add New Category -->
        <form id="add-category-form">
          <input type="text" id="new-category" placeholder="Enter category name" required />
          <button type="submit" id="add-category-btn">Add Category</button>
        </form>

        <!-- List of Categories -->
        <ul id="categories-list">
          <!-- Dynamically loaded categories go here -->
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; Book Notes App</p>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="./js/auth.js"></script>
  <script src="./js/categories.js"></script>
  <script src="./js/books.js"></script>
  <script src="./js/notes.js"></script>
  <script src="./js/app.js"></script>

  <!-- Hook up form to function -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Load categories on page load
      if (document.getElementById('categories-list')) {
        loadCategories();
      }

      // Hook form submission
      const form = document.getElementById('add-category-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          addCategory();
        });
      }
    });
  </script>
</body>
</html>
