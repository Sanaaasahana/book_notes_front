[build]
  command = "npm run build"  
  publish = "client"         
  base = ""                 


[build.environment]
  NODE_VERSION = "18"        
  REACT_APP_API_URL = "https://backend-cpn2.onrender.com" 


[dev]
  framework = "#custom"      
  command = "npm run dev"    
  targetPort = 3000           
  publish = "client"         


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
