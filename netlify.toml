[build]
  publish = "client"   # Points to your static files folder
  command = ""         # No build step needed

# For single-page apps (like React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Development settings
[dev]
  framework = "#static"
  command = "echo 'No dev server needed for static site'"
  targetPort = 3000    # Only used if you add a live-server later
